}

/* ==========================================================================
   MOCK EXAM MODE
========================================================================== */
let exam = null;          // in-progress exam
let lastResult = null;    // most recent finished exam (for the result screen)
let timerHandle = null;
let reviewWrongOnly = true;

function examKey() { return EXAM_KEY_PREFIX + userEmail; }
function persistExam() { if (exam) lsSet(examKey(), exam); }

function planExam(type) {
  const ratio = type === "mini" ? CFG.miniRatio : 1;
  return CFG.subjects.map(s => {
    const want = Math.max(1, Math.round(s.count * ratio));
    const pool = BANK.filter(q => q.category === s.name).length;
    return { name: s.name, want, take: Math.min(want, pool), pool };
  });
}
function examMinutes(n) { return Math.max(1, Math.round(n * MIN_PER_Q)); }

function setAppMode(mode) {
  appMode = mode;
  document.querySelectorAll(".tab[data-app]").forEach(t => t.classList.toggle("active", t.dataset.app === mode || (mode === "RESULT" && t.dataset.app === "EXAM")));
  document.getElementById("practice-view").classList.toggle("hidden", mode !== "PRACTICE");
  document.getElementById("fab-wrap").classList.toggle("hidden", mode !== "PRACTICE");
  document.body.classList.toggle("has-fab", mode === "PRACTICE");   // extra bottom padding so the button never hides content
  document.getElementById("exam-start-view").classList.toggle("hidden", mode !== "EXAM");
  document.getElementById("exam-result-view").classList.toggle("hidden", mode !== "RESULT");
  document.getElementById("browse-view").classList.toggle("hidden", mode !== "BROWSE");
  document.getElementById("books-view").classList.toggle("hidden", mode !== "BOOKS");
  document.getElementById("btn-top").classList.remove("show");
  if (mode === "PRACTICE") renderStudyMenu();
  if (mode === "EXAM") renderExamStart();
  if (mode === "BROWSE") renderBrowse();
  if (mode === "BOOKS") renderBooks();
  window.scrollTo(0, 0);
}

function renderExamStart() {
  const el = document.getElementById("exam-start-view");
  const type = prefs.examType;
  const plan = planExam(type);
  const n = plan.reduce((a, p) => a + p.take, 0);
  const wantN = plan.reduce((a, p) => a + p.want, 0);
  const short = plan.filter(p => p.take < p.want);
  const fullN = FULL_COUNT, miniN = planExam("mini").reduce((a, p) => a + p.want, 0);

  el.innerHTML = `
    <div class="card">
      <div class="section-title">出題形式を選択</div>
      <div class="exam-choice">
        <button class="exam-option ${type === "full" ? "active" : ""}" data-type="full">
          <div class="eo-title">本番形式</div><div class="eo-sub">${fullN}問 / ${CFG.minutes}分</div>
        </button>
        <button class="exam-option ${type === "mini" ? "active" : ""}" data-type="mini">
          <div class="eo-title">ミニ模試</div><div class="eo-sub">${miniN}問 / ${examMinutes(miniN)}分（同じ科目比率）</div>
        </button>
      </div>
      <table class="info-table" style="margin-top:14px">
        <tr><th>科目</th><th class="num">出題数</th><th class="num">問題バンク</th></tr>
        ${plan.map(p => `<tr><td>${escapeHtml(p.name)}</td><td class="num">${p.take}${p.take < p.want ? ` <span style="color:var(--warn)">/ ${p.want}</span>` : ""}</td><td class="num">${p.pool}問</td></tr>`).join("")}
        <tr><td><strong>合計</strong></td><td class="num"><strong>${n}問</strong></td><td class="num">${examMinutes(n)}分</td></tr>
      </table>
      ${short.length ? `<div class="warn-note">問題バンクが不足しているため、${short.map(p => escapeHtml(p.name)).join("・")}は出題数が少なくなります（${n}/${wantN}問）。試験時間は問題数に合わせて調整されます。</div>` : ""}
    </div>

    <div class="card">
      <div class="section-title">試験のルール</div>
      <ul class="rules">
        <li>四肢択一・CBT方式。解答中は正誤が表示されません。</li>
        <li>解答はいつでも変更可能。🚩「見直し」で後から確認したい問題に印を付けられます。</li>
        <li>時間切れになると自動的に採点されます。</li>
        <li>合格の目安：総合 ${pct(CFG.passOverall)} 以上、かつ各科目 ${pct(CFG.passSubject)} 以上。</li>
        <li>禁忌肢（倫理上明らかに許されない選択肢）を ${CFG.tabooFailCount} つ以上選ぶと不合格。</li>
        <li>法令・税制等は ${escapeHtml(CFG.lawBaseDate)} 時点の内容に基づきます。</li>
      </ul>
      <div class="note">※ 合格基準・禁忌肢の扱いは中小企業庁の検討会資料に基づく暫定値です。正式発表後に更新します。</div>
    </div>

    <div class="card">
      <button class="btn-primary" id="btn-start-exam" ${n === 0 ? "disabled" : ""}>試験を開始する</button>
    </div>

    <div class="card">
      <div class="section-title">受験履歴</div>
      ${history.length ? `<ul class="history-list">${history.map(h => `
        <li>
          <span>${new Date(h.date).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}　${escapeHtml(h.type)}</span>
          <span>${h.correct}/${h.total}（${h.total ? pct(h.correct / h.total) : "-"}）<span class="pill ${h.pass ? "pass" : "fail"}">${h.pass ? "合格" : "不合格"}</span></span>
        </li>`).join("")}</ul>` : `<div class="note" style="margin-top:0">まだ受験記録はありません。</div>`}
    </div>`;

  el.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { prefs.examType = b.dataset.type; savePrefs(); renderExamStart(); });
  document.getElementById("btn-start-exam").onclick = startExam;
}

function startExam() {
  const type = prefs.examType;
  const plan = planExam(type);
  const ids = [];
  plan.forEach(p => shuffled(BANK.filter(q => q.category === p.name)).slice(0, p.take).forEach(q => ids.push(q.id)));
  if (!ids.length) return;
  const now = Date.now();
  exam = { type, ids, answers: {}, flags: {}, current: 0, startAt: now, endAt: now + examMinutes(ids.length) * 60000,
           orders: ids.map(id => optionOrder(byId.get(id))) };   // choice order fixed for the whole exam (and its review)
  persistExam();
  openCbt();
}

function openCbt() {
  document.getElementById("app-main").classList.add("hidden");
  document.getElementById("cbt").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  renderCbt();
  clearInterval(timerHandle);
  timerHandle = setInterval(tickTimer, 500);
  tickTimer();
}
function closeCbt() {
  clearInterval(timerHandle);
  document.getElementById("cbt").classList.add("hidden");
  document.getElementById("app-main").classList.remove("hidden");
  document.body.style.overflow = "";
  closeModal();
}

function tickTimer() {
  if (!exam) return;
  const left = exam.endAt - Date.now();
  const t = document.getElementById("cbt-timer");
  t.textContent = "残り " + mmss(left);
  t.classList.toggle("low", left < 10 * 60000);
  if (left <= 0) finishExam(true);
}

function renderCbt() {
  const i = exam.current, n = exam.ids.length;
  const q = byId.get(exam.ids[i]);
  const chosen = exam.answers[i];
  const answeredCount = Object.keys(exam.answers).length;
  document.getElementById("cbt-pos").textContent = `第 ${i + 1} 問 / ${n}　(解答済 ${answeredCount})`;
  document.getElementById("cbt-progress-fill").style.width = `${answeredCount / n * 100}%`;
  document.getElementById("cbt-prev").disabled = i === 0;
  const next = document.getElementById("cbt-next");
  next.textContent = i === n - 1 ? "問題一覧" : "次へ →";
  const flag = document.getElementById("cbt-flag");
  flag.classList.toggle("flag-on", Boolean(exam.flags[i]));
  flag.textContent = exam.flags[i] ? "🚩 見直し中" : "🚩 見直し";

  const body = document.getElementById("cbt-body");
  body.innerHTML = `
    <div class="question-card">
      <div class="q-meta"><div class="q-meta-left"><span class="q-num">第 ${i + 1} 問</span><span class="q-category">${escapeHtml(q.category)}</span></div></div>
      <div class="q-text">${fmt(q.question)}</div>
      <div class="options-grid">
        ${choiceButtonsHtml(q, exam.orders && exam.orders[i], chosen)}
      </div>
    </div>`;
  body.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => chooseExamOption(Number(b.dataset.opt)));
  body.scrollTop = 0;
}
function chooseExamOption(idx) {
  if (exam.answers[exam.current] === idx) delete exam.answers[exam.current];  // tap again to clear
  else exam.answers[exam.current] = idx;
  persistExam(); renderCbt();
}
function cbtGo(i) {
  if (i < 0 || i >= exam.ids.length) return;
  exam.current = i; persistExam(); renderCbt();
}

function openModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal() { document.getElementById("modal").classList.add("hidden"); }

function openNavigator() {
  const n = exam.ids.length;
  const unanswered = n - Object.keys(exam.answers).length;
  const flagged = Object.keys(exam.flags).length;
  let html = `<div class="modal-title">問題一覧</div>
    <div class="legend"><span>■ 解答済</span><span>□ 未解答 ${unanswered}</span><span style="color:#f59e0b">● 見直し ${flagged}</span></div>`;
  let lastSubj = null;
  exam.ids.forEach((id, i) => {
    const subj = byId.get(id).category;
    if (subj !== lastSubj) { html += `${lastSubj !== null ? "</div>" : ""}<div class="grid-subject">${escapeHtml(subj)}</div><div class="q-grid">`; lastSubj = subj; }
    const cls = ["q-cell", exam.answers[i] !== undefined ? "answered" : "", exam.flags[i] ? "flagged" : "", i === exam.current ? "current" : ""].join(" ");
    html += `<button class="${cls}" data-go="${i}">${i + 1}</button>`;
  });
  html += `</div><div class="modal-actions"><button class="btn-secondary" id="nav-close">閉じる</button><button class="btn-primary" id="nav-finish">試験終了</button></div>`;
  openModal(html);
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { closeModal(); cbtGo(Number(b.dataset.go)); });
  document.getElementById("nav-close").onclick = closeModal;
  document.getElementById("nav-finish").onclick = confirmFinish;
}

function confirmFinish() {
  const n = exam.ids.length;
  const unanswered = n - Object.keys(exam.answers).length;
  const flagged = Object.keys(exam.flags).length;
  openModal(`
    <div class="modal-title">試験を終了して採点しますか？</div>
    <p style="font-size:0.88rem;color:var(--text-sub);margin-top:8px">
      未解答：<strong style="color:${unanswered ? "var(--danger)" : "inherit"}">${unanswered}問</strong>　見直し：<strong>${flagged}問</strong><br>
      残り時間：${mmss(exam.endAt - Date.now())}<br>終了後は解答を変更できません。
    </p>
    <div class="modal-actions"><button class="btn-secondary" id="cf-back">問題に戻る</button><button class="btn-primary" id="cf-ok">終了して採点</button></div>`);
  document.getElementById("cf-back").onclick = closeModal;
  document.getElementById("cf-ok").onclick = () => finishExam(false);
}

function scoreExam(ex) {
  const subjects = SUBJECT_NAMES.map(name => ({ name, correct: 0, total: 0 }));
  const tabooHits = [];
  let correct = 0;
  ex.ids.forEach((id, i) => {
    const q = byId.get(id);
    const s = subjects.find(x => x.name === q.category);
    const a = ex.answers[i];
    if (s) s.total++;
    if (a === q.answer) { correct++; if (s) s.correct++; }
    if (a !== undefined && isTaboo(q, a)) tabooHits.push(i);
  });
  const used = subjects.filter(s => s.total > 0);
  const total = ex.ids.length;
  const reasons = [];
  if (correct / total < CFG.passOverall) reasons.push(`総合得点が ${pct(CFG.passOverall)} に届いていません`);
  used.forEach(s => { if (s.correct / s.total < CFG.passSubject) reasons.push(`${s.name} が科目別基準 ${pct(CFG.passSubject)} を下回っています`); });
  if (tabooHits.length >= CFG.tabooFailCount) reasons.push(`禁忌肢を ${tabooHits.length} 問で選択しました`);
  return {
    type: ex.type, ids: ex.ids, answers: ex.answers, orders: ex.orders, correct, total, subjects: used, tabooHits, reasons,
    pass: reasons.length === 0,
    minutesUsed: Math.round((Math.min(Date.now(), ex.endAt) - ex.startAt) / 60000)
  };
}

function finishExam(timeUp) {
  if (!exam) return;
  const result = scoreExam(exam);
  // wrong answers in the mock exam count as misses and come back in today's review
  let changed = false;
  result.ids.forEach((id, i) => { if (result.answers[i] !== byId.get(id).answer) { markMissed(id); changed = true; } });
  if (changed) saveState();

  lastResult = result;
  exam = null;
  lsDel(examKey());
  closeCbt();
  history.unshift({ date: new Date().toISOString(), type: result.type === "mini" ? "ミニ模試" : "本番形式", correct: result.correct, total: result.total, pass: result.pass });
  queueExamResult({
    type: result.type, correct: result.correct, total: result.total, pass: result.pass,
    subjects: result.subjects, tabooHits: result.tabooHits.length, minutesUsed: result.minutesUsed
  });
  cacheLocal();
  reviewWrongOnly = true;
  renderResult(timeUp);
  setAppMode("RESULT");
}

    <div class="card">
      <div class="section-title">科目別の結果</div>
      ${r.subjects.map(s => {
        const p = s.correct / s.total, below = p < CFG.passSubject;
        return `<div class="subject-row">
          <div class="subject-head"><span>${escapeHtml(s.name)}</span><span class="${below ? "below" : ""}">${s.correct}/${s.total}（${pct(p)}）</span></div>
          <div class="bar"><div class="bar-fill ${below ? "below" : ""}" style="width:${p * 100}%"></div><div class="bar-mark" style="left:${CFG.passSubject * 100}%" title="科目別基準"></div></div>
        </div>`;
      }).join("")}
      <div class="note">縦線は科目別基準（${pct(CFG.passSubject)}）。禁忌肢の選択：${r.tabooHits.length}問</div>
    </div>

    <div class="card result-actions">
      <button class="btn-primary" id="res-retake">もう一度受験する</button>
      ${r.ids.some((id, i) => r.answers[i] !== byId.get(id).answer) ? `<button class="btn-secondary" id="res-practice">間違えた問題を復習する</button>` : ""}
    </div>

    <div class="card controls" style="flex-direction:row;align-items:center;justify-content:space-between">
      <span class="section-title" style="margin:0">解答の振り返り</span>
      <div class="filter-group">
        <button class="btn-filter ${reviewWrongOnly ? "active" : ""}" data-rv="wrong">間違いのみ</button>
        <button class="btn-filter ${!reviewWrongOnly ? "active" : ""}" data-rv="all">すべて</button>
      </div>
    </div>
    ${reviewItems.length ? reviewItems.map(({ q, i, a }) => `

        <div class="q-meta"><div class="q-meta-left"><span class="q-num">第 ${i + 1} 問</span><span class="q-category">${escapeHtml(q.category)}</span></div>
          <span class="q-status ${a === q.answer ? "status-correct" : "status-wrong"}">${a === undefined ? "未解答" : a === q.answer ? "正解" : "不正解"}</span></div>
        <div class="q-text">${fmt(q.question)}</div>
        <div class="options-grid">${revealedOptionsHtml(q, a, r.orders && r.orders[i])}</div>
        ${explanationHtml(q, a, "", r.orders && r.orders[i])}
      </div>`).join("") : `<div class="empty-state">全問正解です！</div>`}
  `;
  document.getElementById("res-retake").onclick = () => setAppMode("EXAM");
  const rp = document.getElementById("res-practice");
  if (rp) rp.onclick = () => { setAppMode("PRACTICE"); startStudy({ main: r.ids.filter((id, i) => r.answers[i] !== byId.get(id).answer) }); };
  el.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { reviewWrongOnly = b.dataset.rv === "wrong"; renderResult(false); });
}

function maybeResumeExam() {
  const saved = lsGet(examKey());
  if (!saved || !Array.isArray(saved.ids) || !saved.ids.every(id => byId.has(id))) { lsDel(examKey()); return; }
  exam = saved;
  if (Date.now() >= exam.endAt) { finishExam(true); return; }
  openModal(`
    <div class="modal-title">受験中の模擬試験があります</div>
    <p style="font-size:0.88rem;color:var(--text-sub);margin-top:8px">残り時間 ${mmss(exam.endAt - Date.now())}・解答済 ${Object.keys(exam.answers).length}/${exam.ids.length}問<br>（時間は中断中も経過しています）</p>
    <div class="modal-actions"><button class="btn-secondary" id="rs-discard">破棄する</button><button class="btn-primary" id="rs-resume">再開する</button></div>`);
  document.getElementById("rs-resume").onclick = () => { closeModal(); setAppMode("EXAM"); openCbt(); };
  document.getElementById("rs-discard").onclick = () => { exam = null; lsDel(examKey()); closeModal(); };
}

/* ==========================================================================
   QUESTION BROWSER (list → tap to see answer + explanation)
========================================================================== */
let browseFilter = "ALL";
let browseSearch = "";
let browseLevel = "ALL";

function renderBrowse() {
  const cats = document.getElementById("browse-cats");
  cats.querySelectorAll(".btn-filter").forEach(b => b.remove());
  const extra = [...new Set(BANK.map(q => q.category))].filter(c => !SUBJECT_NAMES.includes(c));
  const allCats = [...SUBJECT_NAMES, ...extra];
  ["ALL", ...allCats].forEach(cat => {
    const n = cat === "ALL" ? BANK.length : BANK.filter(q => q.category === cat).length;
    const b = document.createElement("button");
    b.className = "btn-filter" + (browseFilter === cat ? " active" : "");
    b.innerHTML = `${escapeHtml(cat === "ALL" ? "すべて" : cat)}<span class="count">${n}</span>`;
    b.onclick = () => { browseFilter = cat; renderBrowse(); };
    cats.appendChild(b);
  });

  const lvBox = document.getElementById("browse-lv");
  lvBox.querySelectorAll(".btn-filter").forEach(b => b.remove());
  [["ALL", "すべて"], ["weak", "苦手"], ["new", "未学習"], ["learning", "学習中"], ["young", "定着中"], ["mastered", "習得"]].forEach(([v, label]) => {
    const b = document.createElement("button");
    b.className = "btn-filter" + (browseLevel === v ? " active" : "");
    b.textContent = label;
    b.onclick = () => { browseLevel = v; renderBrowse(); };
    lvBox.appendChild(b);
  });

  const term = browseSearch;
  const lvOk = q => browseLevel === "ALL" || (browseLevel === "weak" ? isWeak(q.id) : level(q.id) === browseLevel);
  const matches = q => lvOk(q) && (!term || String(q.id) === term.replace(/^no\.?/, "") ||
    [q.question, ...q.options, q.explanation.overview, ...(q.explanation.details || [])].join("\n").toLowerCase().includes(term));
  const list = document.getElementById("browse-list");
  let html = "";
  (browseFilter === "ALL" ? allCats : [browseFilter]).forEach(cat => {
    const qs = BANK.filter(q => q.category === cat && matches(q));
    if (!qs.length) return;
    html += `<div class="browse-group-title">${escapeHtml(cat)}（${qs.length}問）</div><div class="b-list">`;
    qs.forEach(q => {
      const c = card(q.id);
      html += `<details class="b-item" data-id="${q.id}"><summary>
        <span class="lv-dot lv-${level(q.id)}" title="${LEVELS[level(q.id)]}"></span><span class="b-id">No.${escapeHtml(q.id)}</span>
        <span class="b-q">${escapeHtml(String(q.question || "").replace(/\s+/g, " "))}</span>
        ${c && c.w ? `<span class="miss-tag">×${c.w}</span>` : ""}
        ${Array.isArray(q.taboo) && q.taboo.length ? '<span class="taboo-badge">禁忌肢</span>' : ""}
        ${bankErrorsById[q.id] ? '<span class="b-warn" title="データに問題があります">⚠</span>' : ""}
      </summary><div class="b-body"></div></details>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html || `<div class="empty-state">${BANK.length ? "該当する問題がありません。" : "問題がまだ登録されていません。"}</div>`;

  list.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => {
    if (!d.open) return;
    list.querySelectorAll("details[open]").forEach(o => { if (o !== d) o.open = false; });   // one open at a time
    const body = d.querySelector(".b-body");
    if (!body.innerHTML) body.innerHTML = browseBodyHtml(byId.get(Number(d.dataset.id)) || byId.get(d.dataset.id));
    const top = d.getBoundingClientRect().top;
    if (top < 0 || top > window.innerHeight * 0.6) d.scrollIntoView({ block: "start", behavior: "smooth" });
  }));
}

function browseBodyHtml(q) {
  if (!q) return "";
  const details = Array.isArray(q.explanation.details) ? q.explanation.details : [];
  const mine = state.answers[q.id];
  const errs = bankErrorsById[q.id];
  return `
    <div class="q-text">${fmt(q.question)}</div>
    <ul class="b-opts">
      ${q.options.map((opt, i) => {
        const ok = i === q.answer;
        return `<li class="b-opt ${ok ? "ok" : "ng"}">
          <span class="b-mark">${ok ? "✓" : "✗"}</span>
          <div>
            <div class="b-opt-text">${i + 1}. ${fmt(opt)}${tabooBadge(q, i)}${mine === i ? '<span class="mine-badge">あなたの解答</span>' : ""}</div>
            ${details[i] ? `<div class="b-note">${fmt(details[i])}</div>` : ""}
          </div>
        </li>`;
      }).join("")}
    </ul>
    ${q.explanation.overview ? `<div class="b-overview"><strong>解説</strong>${fmt(q.explanation.overview)}</div>` : ""}
    ${figuresHtml(q)}
    ${sourceHtml(q)}
    ${errs ? `<div class="b-errors">⚠ データの問題：${errs.map(escapeHtml).join(" / ")}</div>` : ""}`;
}

/* ==========================================================================
   Wiring
========================================================================== */
function initApp() {
  // Start button: floating above the bottom bar on phones; inline under 記憶の定着度 on wide screens
  const mqWide = window.matchMedia("(min-width: 768px)");
  const placeFab = () => {
    const w = document.getElementById("fab-wrap");
    if (mqWide.matches) { w.classList.add("inline"); document.getElementById("practice-view").appendChild(w); }
    else { w.classList.remove("inline"); document.getElementById("app-main").insertBefore(w, document.getElementById("settings")); }
  };
  if (mqWide.addEventListener) mqWide.addEventListener("change", placeFab); else mqWide.addListener(placeFab);
  placeFab();

  const settings = document.getElementById("settings");
  document.getElementById("btn-settings").onclick = () => settings.classList.remove("hidden");
  document.getElementById("settings-close").onclick = () => settings.classList.add("hidden");
  settings.addEventListener("click", e => { if (e.target === settings) settings.classList.add("hidden"); });
  document.querySelectorAll(".tab[data-app]").forEach(t => t.onclick = () => setAppMode(t.dataset.app));
  document.getElementById("btn-reset").onclick = () => { document.getElementById("settings").classList.add("hidden"); resetProgressDialog(); };
  document.getElementById("study-close").onclick = closeStudy;
  // 📖 出典 links (anywhere) open the book reader
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest(".src-link");
    if (a) openReader(a.dataset.book, Number(a.dataset.page), a.dataset.mark);
  });
  document.getElementById("reader-close").onclick = closeReader;
  document.getElementById("reader-chapter").onchange = e => {
    const el = document.getElementById(`rp-${e.target.value}`);
    const body = document.getElementById("reader-body");
    if (el) body.scrollTop = el.offsetTop - (el.previousElementSibling && el.previousElementSibling.classList.contains("rp-chap") ? 34 : 6);
  };
  let rpTick = false;
  document.getElementById("reader-body").addEventListener("scroll", () => {
    if (rpTick) return;
    rpTick = true;
    requestAnimationFrame(() => { rpTick = false; updateReaderPos(); });
  }, { passive: true });
  let bt;
  document.getElementById("browse-search").addEventListener("input", e => {
    clearTimeout(bt);
    bt = setTimeout(() => { browseSearch = e.target.value.trim().toLowerCase(); renderBrowse(); }, 200);
  });

  document.getElementById("cbt-prev").onclick = () => cbtGo(exam.current - 1);
  document.getElementById("cbt-next").onclick = () => exam.current === exam.ids.length - 1 ? openNavigator() : cbtGo(exam.current + 1);
  document.getElementById("cbt-flag").onclick = () => {
    if (exam.flags[exam.current]) delete exam.flags[exam.current]; else exam.flags[exam.current] = true;
    persistExam(); renderCbt();
  };
  document.getElementById("cbt-list").onclick = openNavigator;
  document.getElementById("cbt-finish").onclick = confirmFinish;
  document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal" && exam) closeModal(); });

  const topBtn = document.getElementById("btn-top");
  topBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  window.addEventListener("scroll", () => topBtn.classList.toggle("show", appMode !== "EXAM" && window.scrollY > 600), { passive: true });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (reader) { if (e.key === "Escape") closeReader(); return; }
    const n = Number(e.key);
    if (exam && !document.getElementById("cbt").classList.contains("hidden")) {
      if (!document.getElementById("modal").classList.contains("hidden")) return;
      if (e.key === "ArrowRight") cbtGo(exam.current + 1);
      else if (e.key === "ArrowLeft") cbtGo(exam.current - 1);
      else {
        const eq = byId.get(exam.ids[exam.current]);
        if (n >= 1 && n <= eq.options.length) chooseExamOption(validOrder(eq, exam.orders && exam.orders[exam.current])[n - 1]);
      }
      return;
    }
    if (!study || !document.getElementById("modal").classList.contains("hidden")) return;
    if (e.key === "Escape") return closeStudy();
    if (study.current === null) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); closeStudy(); } return; }
    const q = byId.get(study.current);
    if (study.answered === null) { if (n >= 1 && n <= q.options.length) answerStudy(validOrder(q, study.order)[n - 1]); return; }
    const correct = study.answered === q.answer;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); gradeStudy(correct ? 3 : 1); }
    else if (n >= 1 && n <= 4) gradeStudy(correct ? n : 1);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { flushSave(); cacheLocal(); }
    else { refreshFromServer(); if (exam) tickTimer(); }
  });
  window.addEventListener("beforeunload", e => {
    if (dirty || saving) { flushSave(); e.preventDefault(); e.returnValue = ""; }
  });

  document.getElementById("login-title").textContent = CFG.examName;
  document.getElementById("login-form").addEventListener("submit", handleLogin);
  document.querySelectorAll("[data-lm]").forEach(b => b.onclick = () => setLoginMode(b.dataset.lm));
  setLoginMode(lsGet("ma_exam_last_email") ? "existing" : "new");
  document.getElementById("btn-logout").onclick = () => { document.getElementById("settings").classList.add("hidden"); logout(); };
  document.getElementById("install-hint-close").onclick = () => { lsSet("ma_install_hint_dismissed", true); document.getElementById("install-hint").classList.add("hidden"); };
  window.addEventListener("online", () => { flushSave(); flushExamResults(); });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  startSession();
}

function showOverlay(html, isError) {
  const overlay = document.getElementById("overlay"), box = document.getElementById("overlay-box");
  box.classList.toggle("error", Boolean(isError));
  box.innerHTML = html || `<div class="spinner"></div><div>学習データを読み込んでいます…</div>`;
  overlay.classList.remove("hide");
}
function hideOverlay() { document.getElementById("overlay").classList.add("hide"); }

function showLogin(msg) {
  appShown = false;
  hideOverlay();
  closeCbt();
  document.getElementById("app-main").classList.add("hidden");
  document.getElementById("login-view").classList.remove("hidden");
  document.getElementById("login-error").textContent = msg || "";
  const last = lsGet("ma_exam_last_email");
  if (last && !document.getElementById("login-email").value) document.getElementById("login-email").value = last;
}

function showApp() {
  appShown = true;
  hideOverlay();
  document.getElementById("login-view").classList.add("hidden");
  document.getElementById("app-main").classList.remove("hidden");
  document.getElementById("user-email").textContent = userEmail;
  setSync(dirty ? "pending" : "saved");
  setAppMode("PRACTICE");
  maybeResumeExam();
  maybeShowInstallHint();
}

function startSession() {
  if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
    showOverlay(`<div>config.js の API_URL が設定されていません。</div><div style="font-size:0.8rem">README の手順に従って Apps Script の URL を貼り付けてください。</div>`, true);
    return;
  }
  if (!session || !session.token) { showLogin(); return; }
  userEmail = session.email;

  // Show cached questions + progress immediately (fast start, works offline), then sync.
  const qc = lsGet(QCACHE_KEY);
  if (qc && qc.owner === userEmail && Array.isArray(qc.questions)) { setQuestions(qc.questions); questionsVersion = qc.version; }
  else { setQuestions([]); questionsVersion = null; }
  const lc = lsGet(LINKS_KEY);
  LINKS = lc && lc.owner === userEmail && Array.isArray(lc.links) ? lc.links : [];
  const bc = lsGet(BOOKS_KEY);
  if (bc && bc.owner === userEmail && bc.books && bc.books.index) { BOOKS = bc.books; booksVersion = bc.version; }
  else { BOOKS = null; booksVersion = null; }
  const cached = lsGet(CACHE_PREFIX + userEmail);
  if (cached && questionsVersion) {
    state = normalizeState(cached.state);
    history = cached.history || [];
    dirty = Boolean(cached.dirty);
    showApp();
  } else {
    showOverlay();
  }

  api("load", { questionsVersion, booksVersion }).then(res => {
    history = res.history || [];
    setLinks(res.links);
    const bChanged = applyBooks(res);
    const qChanged = applyQuestions(res) || bChanged;   // re-render so 出典 links appear
    if (dirty) flushSave();                  // local unsaved changes win
    else state = normalizeState(res.state);
    cacheLocal();
    if (!appShown) showApp();
    else refreshCurrentView(qChanged);
    flushExamResults();
  }).catch(e => {
    if (e.code === "AUTH") return forceLogout("ログインの有効期限が切れました。もう一度ログインしてください。");
    if (appShown) { setSync("error"); return; }   // offline but cached: keep studying
    showOverlay(`<div>サーバーに接続できませんでした。</div>
      <div style="font-size:0.8rem">${escapeHtml(e.message)}</div>
      <button class="btn-nav" style="flex:none;padding:10px 20px" id="btn-retry-load">再試行</button>`, true);
    document.getElementById("btn-retry-load").onclick = startSession;
  });
}

// Must match USERNAME_RE in Code.gs. First char not . or - (avoids spreadsheet formula injection).
const USERNAME_RE = /^[a-z0-9_぀-ヿ一-鿿０-９ａ-ｚ][a-z0-9_.\-぀-ヿ一-鿿０-９ａ-ｚ]{1,19}$/;

let loginMode = "existing";   // "existing" = 続きから / "new" = はじめて
function setLoginMode(m) {
  loginMode = m;
  document.querySelectorAll("[data-lm]").forEach(b => b.classList.toggle("active", b.dataset.lm === m));
  document.getElementById("login-email-label").textContent = m === "new" ? "ユーザー名（自由に決めてください）" : "ユーザー名";
  document.getElementById("login-submit").textContent = m === "new" ? "登録して始める" : "ログイン";
  document.getElementById("login-note").textContent = m === "new"
    ? "好きなユーザー名で登録します（メールアドレスや本名は不要です）。次回からはこのユーザー名とチームコードで「続きから」ログインしてください。"
    : "前回と同じユーザー名を入力してください。初めての方は「はじめて」を選んでください。";
  document.getElementById("login-error").textContent = "";
}
function handleLogin(ev) {
  ev.preventDefault();
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const teamCode = document.getElementById("login-team").value.trim();
  const err = document.getElementById("login-error");
  // "email" is the historical field name; it now holds a user-chosen username.
  if (email.includes("@")) { err.textContent = "メールアドレスではなく、好きなユーザー名を入力してください。"; return; }
  if (!USERNAME_RE.test(email)) { err.textContent = "ユーザー名は2〜20文字の英数字・日本語・記号（_ . -）で入力してください（先頭に . や - は使えません）。"; return; }
  if (!teamCode) { err.textContent = "チームコードを入力してください。"; return; }
  const btn = document.getElementById("login-submit");
  btn.disabled = true; btn.textContent = "確認中…"; err.textContent = "";
  session = null;
  api("login", { email, teamCode, mode: loginMode })
    .then(res => {
      session = { email: res.email, token: res.token };
      lsSet(SESSION_KEY, session);
      lsSet("ma_exam_last_email", res.email);
      document.getElementById("login-team").value = "";
      startSession();
    })
    .catch(e => { err.textContent = e.message; })
    .finally(() => { btn.disabled = false; btn.textContent = loginMode === "new" ? "登録して始める" : "ログイン"; });
}

function resetSessionVars() {
  clearTimeout(saveTimer);
  state = { answers: {}, srs: {}, days: {} };
  history = []; dirty = false; saving = false; exam = null; lastResult = null;
  if (study) { study = null; document.getElementById("study").classList.add("hidden"); document.body.style.overflow = ""; }
}
function forceLogout(msg) {
  lsDel(SESSION_KEY); session = null;
  lsDel(QCACHE_KEY); lsDel(LINKS_KEY); LINKS = []; lsDel(BOOKS_KEY); BOOKS = null; booksVersion = null; if (reader) closeReader(); setQuestions([]); questionsVersion = null;
  resetSessionVars();
  showLogin(msg);
}
function logout() {
  const unsaved = dirty || saving;
  if (!confirm(unsaved ? "保存されていない学習履歴があります。ログアウトすると失われます。ログアウトしますか？" : "ログアウトしますか？")) return;
  api("logout").catch(() => {});
  lsDel(CACHE_PREFIX + userEmail);
  lsDel(QCACHE_KEY); lsDel(LINKS_KEY); LINKS = []; lsDel(BOOKS_KEY); BOOKS = null; booksVersion = null; if (reader) closeReader(); setQuestions([]); questionsVersion = null;
  lsDel(SESSION_KEY); session = null;
  resetSessionVars();
  showLogin();
}

function maybeShowInstallHint() {
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (isIOS && !standalone && !lsGet("ma_install_hint_dismissed")) document.getElementById("install-hint").classList.remove("hidden");
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
